[package]
name = "vago-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "sync", "time", "fs"] }
teloxide = { version = "0.17", default-features = false, features = ["rustls"] }
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
chrono-tz = "0.10"
fastrand = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
